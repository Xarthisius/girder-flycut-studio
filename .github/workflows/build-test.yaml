name: Testing and Linting

on:
  push:
    branches:
      - main
      - conversion
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # Fast lane: everything that needs neither MongoDB nor the patched JSONForms
  # checkout. This is the gate that should stay green at all times.
  check:
    name: Lint, build, and frontend tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install linters
        run: |
          python -m pip install --upgrade pip ruff
          npm ci

      - name: Lint Python
        run: ruff check .

      # The browser sources are plain scripts assembled by build_dashboard.py,
      # so eslint is the only thing that reads them. Formatting rules are off
      # on purpose -- see .eslintrc.md.
      - name: Lint JavaScript
        run: npm run lint

      # Generates the three derived sources from config_builder/static/ and
      # bundles them with Vite. The generator asserts a match count for every
      # literal substitution, so markup that moves fails here rather than
      # silently dropping a control. The bundle is no longer committed, so
      # there is nothing to check for staleness.
      - name: Build the browser bundle
        run: npm run build

      # bundle.cjs loads the built artifact against a stub girder global. node
      # --check proves it parses; only running it proves build_dashboard.py put
      # the pieces in the right places.
      - name: Frontend tests
        run: |
          node tests/core.mjs
          node tests/status.mjs
          node tests/workflow.cjs
          node tests/complete_workflow.cjs
          node tests/bundle.cjs

  # Slow lane: the Python suite. Mirrors girder-jsonforms' own workflow, which
  # is the reference for how this dependency has to be set up.
  pytest:
    name: Server tests
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
      # girder-jsonforms takes a Redis lock while ensuring its projects
      # collection at load time. It logs and proceeds when Redis is missing,
      # but its own CI runs one, so match that rather than relying on the
      # fallback path. Note there is deliberately no broker for the pytest job
      # -- see the eagerWorkerTasks note in tests/test_api.py.
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # girder-jsonforms' load() registers static content and md5-hashes every
      # file, so its frontend must be built before any test touches the server
      # fixture -- and a pip install from git cannot build it, because the
      # package ships only prebuilt assets that a git checkout does not carry.
      # This is why the dependency is installed from a checkout rather than by
      # letting pip resolve the reference in setup.py.
      - name: Install girder-jsonforms from the igsn branch
        run: |
          git clone -b igsn https://github.com/Xarthisius/girder-jsonforms.git ../girder-jsonforms
          cd ../girder-jsonforms/girder_jsonforms/web_client
          npm ci
          npm run build
          cd "$GITHUB_WORKSPACE"
          python -m pip install --upgrade pip
          python -m pip install -e ../girder-jsonforms

      # --no-deps: a plain `pip install .` re-resolves the
      # `girder-jsonforms @ git+...@igsn` reference and would replace the built
      # editable install above with an unbuilt one from git.
      #
      # -e: without it the tests import the copy in site-packages while
      # --cov=girder_flycut measures the working tree, so coverage reports 0%
      # on a fully passing run. Editable makes them the same files.
      - name: Install the plugin and its dependencies
        run: |
          python -m pip install ./vendor/girder-dashboards
          python -m pip install --no-deps -e .
          python -m pip install -r requirements-dev.txt

      # Both plugins md5-hash every file they register as static content, so
      # the bundles have to exist before any test uses the `server` fixture.
      # The vendored girder-dashboards ships one prebuilt; ours is built here.
      - name: Build the browser bundle
        run: |
          npm ci
          npm run build

      - name: Run tests with coverage
        env:
          GIRDER_MAX_CURSOR_TIMEOUT_MS: 60000
        run: |
          pytest tests --verbose \
                 --mongo-uri mongodb://127.0.0.1:27017 \
                 --cov=girder_flycut \
                 --cov-report=term \
                 --cov-report=xml \
                 --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  # Third lane: the browser harness. Phase 4 restructures the whole UI and
  # nothing else renders it, so this is what makes that safe. It walks the
  # dashboard against a real Girder and fails on any console error, page error
  # or failed request along the way.
  browser:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      GIRDER_URL: http://127.0.0.1:8989
      GIRDER_ADMIN: admin
      GIRDER_PASSWORD: adminpassword
      # Unlike the pytest job, this one needs a real broker. Creating a
      # deposition fires `deposition.created`, whose JSONForms handler enqueues
      # an AIMD task with .delay() -- and .delay() needs somewhere to enqueue to
      # even though the task returns early without a token. pytest sidesteps
      # that with pytest_girder's eagerWorkerTasks fixture; a running server
      # cannot.
      #
      # Redis, matching the deploy-dev stack, which runs Celery over the same
      # Redis it uses for notifications rather than a separate broker.
      GIRDER_WORKER_BROKER: redis://127.0.0.1:6379/
      GIRDER_WORKER_BACKEND: redis://127.0.0.1:6379/
      GIRDER_NOTIFICATION_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install girder-jsonforms from the igsn branch
        run: |
          git clone -b igsn https://github.com/Xarthisius/girder-jsonforms.git ../girder-jsonforms
          cd ../girder-jsonforms/girder_jsonforms/web_client
          npm ci
          npm run build
          cd "$GITHUB_WORKSPACE"
          python -m pip install --upgrade pip
          python -m pip install -e ../girder-jsonforms

      - name: Install the plugin and build its bundle
        run: |
          python -m pip install ./vendor/girder-dashboards
          python -m pip install --no-deps -e .
          npm ci
          npm run build

      - name: Start Girder
        run: |
          GIRDER_MONGO_URI=mongodb://localhost:27017/girder_flycut_e2e \
            girder serve --host 127.0.0.1 --port 8989 > girder.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf "$GIRDER_URL/api/v1/system/version" > /dev/null; then break; fi
            sleep 2
          done
          curl -sf "$GIRDER_URL/api/v1/system/version" > /dev/null \
            || { echo '::error::Girder failed to start'; cat girder.log; exit 1; }

      - name: Create the admin account
        run: |
          curl -sf -X POST "$GIRDER_URL/api/v1/user" \
            -d "login=$GIRDER_ADMIN" -d "password=$GIRDER_PASSWORD" \
            -d "email=admin@example.org" -d "firstName=Test" -d "lastName=Admin" > /dev/null

      - name: Seed the instance
        run: python3 test/browser/seed.py

      - name: Install the browser
        run: |
          cd test/browser
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify in a browser
        run: node test/browser/verify.cjs

      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-verification
          path: |
            test/browser/screenshots/
            girder.log
          if-no-files-found: warn
          retention-days: 7
