<section id="workflowHome" class="workflow-home">
  <h1>Choose a module</h1>
  <button id="adminSettingsBtn" class="button ghost hidden" type="button">Admin settings</button>
  <div class="workflow-cards workflow-choices">
    <button id="configurationStepBtn" class="workflow-choice" type="button"><span class="step-number">01</span><strong>Configuration</strong><small>Build, edit, or view configurations.</small></button>
    <button id="lightburnStepBtn" class="workflow-choice" type="button"><span class="step-number">02</span><strong>Generation</strong><small>Generate stack identity files from submitted configs</small></button>
    <button id="registerBtn" class="workflow-choice" type="button"><span class="step-number">03</span><strong>Registration</strong><small>Register stack IGSN from file identity files.</small></button>
    <button id="completeWorkflowBtn" class="workflow-choice" type="button"><span class="step-number">1–3</span><strong>Complete Workflow</strong><small>Configure a stack, then submit to generate files and register its IGSN automatically.</small></button>
  </div>
</section>
