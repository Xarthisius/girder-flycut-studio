          <summary><span><b>01</b> Run Parameters <span id="runRequiredMarker" class="section-required-marker hidden" aria-label="Required fields incomplete">*</span></span><span class="chevron">⌃</span></summary>
          <div class="section-body two-col">
            <label class="field" for="stackid"><span class="field-label">Stack ID <span class="required">*</span> <button type="button" class="help" data-tip="A unique stack identifier: a 5-character Crockford ID or legacy F### / F#### ID. Other values require confirmation." aria-label="Stack ID help">?</button></span>
              <div class="template-picker-row"><input id="stackid" name="stackid" placeholder="e.g. 00005" required><button id="autoStackIdBtn" class="button ghost" type="button" aria-label="Assign lowest available Stack ID" aria-pressed="false" title="Assign lowest available Stack ID">AUTO</button></div>
              <small class="error" id="stackidError"></small>
            </label>
            <label class="field" for="operator"><span class="field-label">Operator <button type="button" class="help" data-tip="The person preparing and running this stack." aria-label="Operator help">?</button></span>
              <span class="input-wrap"><input id="operator" name="operator" list="operatorNames" autocomplete="off" placeholder="Name or initials"></span>
              <datalist id="operatorNames"></datalist>
              <small class="error" id="operatorError"></small>
            </label>
            <label class="field"><span class="field-label">Foil material <span class="required">*</span></span>
              <select id="foilMaterial" name="foil_material"><option value="">Loading materials…</option></select>
              <small id="materialMeta" class="field-note">Foil IGSNs from Girder</small>
            </label>
            <label class="field" for="template"><span class="field-label">Template <span class="required">*</span> <button type="button" class="help" aria-label="Template help" data-tip="Choose the LightBurn layout whose flyer positions and laser layers will be configured.">?</button></span>
              <div class="template-picker-row"><select id="template" name="template"><option value="">Loading templates…</option></select><button id="browseTemplateBtn" type="button" class="button ghost" aria-label="Choose template from portal" title="Choose template from portal">+</button></div>
              <small id="templateMeta" class="field-note"></small>
            </label>
          </div>
