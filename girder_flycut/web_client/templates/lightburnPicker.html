<section id="lightburnPicker" class="workflow-home hidden">
  <button id="lightburnPickerBackBtn" class="button ghost" type="button" aria-label="Back to workflow">←</button>
  <h1>Generation</h1>
  <label class="field saved-picker">Submitted configuration
    <select id="submittedConfigs"><option value="">Choose a submitted configuration</option></select>
  </label>
  <p id="filesHint" class="field-note"></p>
  <a id="generatedFolderLink" class="button ghost hidden" target="_blank" rel="noopener">View files ↗</a><button id="deleteFilesBtn" class="button ghost hidden" type="button">Delete generated files</button>
  <button id="generateBtn" class="button primary picker-continue" type="button" disabled>Generate files</button>
</section>
